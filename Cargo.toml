[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gripsack-dev/gripsack"
homepage = "https://gripsack.dev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
gripsack-ir = { version = "0.3.0", path = "crates/gripsack-ir" }
gripsack-store = { version = "0.3.0", path = "crates/gripsack-store" }
gripsack-trace = { version = "0.3.0", path = "crates/gripsack-trace" }
gripsack-config = { version = "0.3.0", path = "crates/gripsack-config" }
gripsack-exec = { version = "0.3.0", path = "crates/gripsack-exec" }
gripsack-fetch = { version = "0.3.0", path = "crates/gripsack-fetch" }
