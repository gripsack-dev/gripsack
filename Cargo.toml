[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gripsack-dev/gripsack"
homepage = "https://gripsack.dev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
gripsack-ir = { path = "crates/gripsack-ir" }
gripsack-store = { path = "crates/gripsack-store" }
gripsack-exec = { path = "crates/gripsack-exec" }
gripsack-fetch = { path = "crates/gripsack-fetch" }
