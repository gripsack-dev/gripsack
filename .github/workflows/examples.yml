name: examples

# API canary: the example env repos under gripsack-dev are applied (or
# typechecked) on every change — if we break the frontend API or the IR
# contract, this fails.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  python-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: gripsack

      - name: Build grip (static musl)
        run: docker compose run --build --rm -e VERSION=0.0.0-ci release
        working-directory: gripsack

      - name: Extract binary
        # dist/ is root-owned (container mount) — extract elsewhere
        run: |
          mkdir -p /tmp/grip-bin
          tar -xzf gripsack/dist/gripsack-*.tar.gz -C /tmp/grip-bin
          echo "GRIP=$(find /tmp/grip-bin -type f -name grip)" >> "$GITHUB_ENV"

      - name: Install the python frontend
        run: |
          python3 -m venv /tmp/fenv
          /tmp/fenv/bin/pip install -q ./gripsack/python

      - uses: actions/checkout@v7
        with:
          repository: gripsack-dev/example-env-python
          path: example

      - name: Apply the example env (twice — the second must be satisfied)
        env:
          HOME: /tmp/example-home
          GRIPSACK_HOME: /tmp/example-home/.gs
        run: |
          mkdir -p "$HOME"
          export PATH="/tmp/fenv/bin:$PATH"
          cd example
          "$GRIP" apply --host laptop | tee /tmp/apply1.log
          grep -q "applied" /tmp/apply1.log
          "$GRIP" apply --host laptop | tee /tmp/apply2.log
          grep -q "already satisfied" /tmp/apply2.log
          "$HOME/.local/bin/hello"
          "$HOME/.local/bin/hello-patched"
          grep -q "catppuccin-mocha" "$HOME/.config/editor/editor.toml"
          "$GRIP" generations | grep -q "→"

  typescript-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: gripsack

      - uses: actions/checkout@v7
        with:
          repository: gripsack-dev/example-env-typescript
          path: example

      - name: Build grip (static musl)
        run: docker compose run --build --rm -e VERSION=0.0.0-ci release
        working-directory: gripsack

      - name: Extract binary
        run: |
          mkdir -p /tmp/grip-bin
          tar -xzf gripsack/dist/gripsack-*.tar.gz -C /tmp/grip-bin
          echo "GRIP=$(find /tmp/grip-bin -type f -name grip)" >> "$GITHUB_ENV"

      - name: Build @gripsack/core
        run: |
          cd gripsack/typescript
          npm ci
          npm run build

      - name: Typecheck the example env
        run: |
          cd example
          npm pkg delete 'dependencies.@gripsack/core'
          npm install "$GITHUB_WORKSPACE/gripsack/typescript"
          npx tsc

      - uses: oven-sh/setup-bun@v2

      - name: Apply the example env (typescript frontend, real eval)
        env:
          HOME: /tmp/example-home-ts
          GRIPSACK_HOME: /tmp/example-home-ts/.gs
          # the driver resolves @gripsack/core from the repo's own
          # install (just typechecked); the provisioned copy would be
          # the not-yet-published version during a PR
          GRIPSACK_TS_FRONTEND: /tmp/ts-frontend
        run: |
          mkdir -p /tmp/ts-frontend/node_modules/@gripsack/core
          cp -r gripsack/typescript/dist gripsack/typescript/package.json \
            /tmp/ts-frontend/node_modules/@gripsack/core/
          cd example
          "$GRIP" check --host laptop
          "$GRIP" apply --host laptop
          "$GRIP" apply --host laptop   # satisfied
