name: examples

# API canary: the example env repos under gripsack-dev are applied (or
# typechecked) on every change — if we break the frontend API or the IR
# contract, this fails.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: gripsack

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gripsack-dev/example-env-typescript
          # Frozen caller lock explicitly migrated to the 0.44.1 frontend.
          ref: 3888c0a7e53c4103773b2acfb6c0495eb3ee1dca
          path: example

      - name: Build grip (static musl)
        run: docker compose run --build --rm -e VERSION=0.0.0-ci release
        working-directory: gripsack

      - name: Extract binary
        # dist/ is root-owned (container mount) — extract elsewhere
        run: |
          mkdir -p /tmp/grip-bin
          tar -xzf gripsack/dist/gripsack-*.tar.gz -C /tmp/grip-bin
          echo "GRIP=$(find /tmp/grip-bin -type f -name grip)" >> "$GITHUB_ENV"

      - name: Build the byte-pinned candidate Conda helper
        working-directory: gripsack
        run: |
          sh tools/conda-helper/dist.sh --dist "$RUNNER_TEMP/conda-helper" \
            --target x86_64-unknown-linux-musl --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.23.2

      - name: Build @gripsack/core
        run: |
          cd gripsack/typescript
          npm ci
          npm run build

      - name: Typecheck the example env
        run: |
          cd example
          npm ci
          npx tsc

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # same pin as the Dockerfile DENO_VERSION / host.rs DENO_RELEASE
          deno-version: v2.9.6

      - name: Apply the example env (real eval, sandboxed Deno)
        env:
          HOME: /tmp/example-home-ts
          GRIPSACK_HOME: /tmp/example-home-ts/.gs
          # authenticated api.github.com — anonymous rate limits 403
          # the gripfetch-apt release lookup on shared runners
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME"
          # the example's own node_modules/@gripsack/core (installed
          # above for the typecheck) shadows the embedded copy — the
          # deliberate-pin rule; that's what makes a pre-release PR
          # exercise the in-repo frontend
          cd example
          approve_fixture() {
            source="$("$GRIP" trust inspect --json)"
            "$GRIP" trust add \
              --bundle "$(printf '%s' "$source" | jq -r .bundle_digest)" \
              --policy "$(printf '%s' "$source" | jq -r .policy_digest)"
          }
          approve_fixture
          "$GRIP" check --host laptop
          "$GRIP" apply --host laptop
          # Apply may publish a lockfile inside the captured read set.
          approve_fixture
          "$GRIP" apply --host laptop   # satisfied

      - name: Consume the frozen coherent Conda workspace
        env:
          HOME: /tmp/example-home-conda
          GRIPSACK_HOME: /tmp/example-home-conda/.gs
          GRIPSACK_CONDA_HELPER_MIRROR: ${{ runner.temp }}/conda-helper
        run: |
          mkdir -p "$HOME"
          cd example/workspaces/conda
          source="$("$GRIP" trust inspect --json)"
          "$GRIP" trust add \
            --bundle "$(printf '%s' "$source" | jq -r .bundle_digest)" \
            --policy "$(printf '%s' "$source" | jq -r .policy_digest)"
          before="$(sha256sum gripsack.lock)"
          "$GRIP" check
          "$GRIP" build ripgrep --json
          result="$(printf 'other\nneedle\n' | "$GRIP" run --env search -- rg '^needle$')"
          test "$result" = needle
          "$GRIP" task version
          "$GRIP" apply personal
          "$GRIP" apply personal
          export GRIPSACK_CONDA_HELPER="$RUNNER_TEMP/unavailable-conda-helper"
          "$GRIP" build ripgrep --json
          "$GRIP" gc
          printf 'rg --version\nexit\n' | "$GRIP" shell search
          test "$(sha256sum gripsack.lock)" = "$before"
