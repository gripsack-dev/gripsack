name: qualify-conda-helper

on:
  workflow_dispatch:
    inputs:
      check_pins:
        description: Require committed pins to match (false measures only)
        type: boolean
        default: false
      include_intel:
        description: Also qualify optional native macOS Intel
        type: boolean
        default: false
      macos_smoke:
        description: Additional exact native process/Conda smoke shell commands (HELPER and DIST exported)
        type: string
        default: ''
  workflow_call:
    inputs:
      check_pins:
        type: boolean
        default: true
      include_intel:
        type: boolean
        default: false
      macos_smoke:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - run: cargo audit --file tools/conda-helper/Cargo.lock

  qualify:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.include_intel && '[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm"},{"target":"aarch64-apple-darwin","runner":"macos-15"},{"target":"x86_64-apple-darwin","runner":"macos-15-intel"}]' || '[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-24.04"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-24.04-arm"},{"target":"aarch64-apple-darwin","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: runner.os == 'macOS'
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - name: Rebuild twice, verify dependencies and execute native protocol smoke
        env:
          CHECK_PINS: ${{ inputs.check_pins }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ "$CHECK_PINS" = true ]; then args+=(--check); fi
          sh tools/conda-helper/dist.sh --dist "$RUNNER_TEMP/conda-dist" --target "$TARGET" "${args[@]}"
      - name: Additional macOS native qualification
        if: runner.os == 'macOS' && inputs.macos_smoke != ''
        env:
          SMOKE_COMMANDS: ${{ inputs.macos_smoke }}
          DIST: ${{ runner.temp }}/conda-dist
          TARGET: ${{ matrix.target }}
        run: |
          export HELPER="$(find "$DIST" -maxdepth 1 -type f -name "gripsack-conda-*-$TARGET")"
          test -x "$HELPER"
          bash -euo pipefail -c "$SMOKE_COMMANDS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-conda-${{ matrix.target }}
          path: ${{ runner.temp }}/conda-dist/*
          if-no-files-found: error
