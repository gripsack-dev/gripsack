name: release-typescript

on:
  push:
    tags: ["ts-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing ts-v* tag to publish"
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          # exact pin (0042 F): refreshed deliberately via
          # scripts/check_pins.py (nodejs.org dist index)
          # setup-node only wires NODE_AUTH_TOKEN into .npmrc when a
          # registry is declared; without it publish fails ENEEDAUTH.
          registry-url: https://registry.npmjs.org/

      # npm test IS `deno test` (0013) — the runner has no deno
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # the same deno the Dockerfile pins (DENO_VERSION) and the
          # runtime provisions (host.rs DENO_RELEASE)
          deno-version: v2.9.6

      # The guard fails a mistagged release instead of publishing the
      # wrong version.
      - name: Guard tag matches package version
        run: |
          ver="$(jq -r .version typescript/package.json)"
          test "ts-v$ver" = "$RELEASE_TAG" || {
            echo "::error::tag $RELEASE_TAG != package version ts-v$ver"; exit 1; }

      - name: Build and pack
        run: |
          cd typescript
          npm ci
          npm test
          # 0.40: tsc emits dist/ (the Deno pin's runtime form —
          # node_modules never type-strips) and typechecks src/
          npm run build
          # the package must contain both artifact forms
          packed="$(npm pack --silent)"
          tar tzf "$packed" | grep -q "package/dist/src/index.js" || {
            echo "::error::npm tarball has no dist/src/index.js — the deliberate pin would break"
            exit 1; }
          tar tzf "$packed" | grep -q "package/src/index.ts" || {
            echo "::error::npm tarball has no src/index.ts — editors get no types"
            exit 1; }

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd typescript
          npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "@gripsack/core ${RELEASE_TAG#ts-v}" \
            --generate-notes
