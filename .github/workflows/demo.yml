name: demo

# Explicit maintenance only; landing or shipping source never rebuilds demos.
# Existing GIFs are historical captures, not evidence of the current release.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build binary for the tape
        run: docker compose run --build --rm -e VERSION=0.0.0-demo release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tarball
          path: dist/*.tar.gz

  render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-tarball
          path: dist

      - name: Render demo GIFs (one per site palette)
        run: |
          # Tapes explicitly approve each changed fixture snapshot using the
          # real interactive source/policy prompt; no ambient CI trust bypass.
          # One render per palette the site's picker offers
          # (gripsack-dev.github.io website/index.html palette-bar), so
          # the site can swap the demo to match the picked palette —
          # the rootle.dev pattern. Theme names are VHS built-ins
          # (THEMES.md); demo.tape's own Output/Theme lines are the
          # default-palette render and stay canonical.
          docker run --rm -v "$PWD:/vhs" -w /vhs \
            --entrypoint sh ghcr.io/charmbracelet/vhs -c '
            apt-get update -qq && apt-get install -y -qq curl unzip >/dev/null \
             && curl -fsSL https://deno.land/install.sh | sh >/dev/null 2>&1 \
             && tar -xzf /vhs/dist/gripsack-*.tar.gz -C /vhs/dist \
             && install -m755 /vhs/dist/gripsack-*/grip /usr/local/bin/grip \
             && export PATH="/root/.deno/bin:$PATH" \
             && render() { \
                  sed -e "s|^Output .*|Output demos/$2.gif|" \
                      -e "s|^Set Theme .*|Set Theme \"$3\"|" \
                      "/vhs/demos/$1.tape" > "/tmp/$2.tape" \
                  && vhs "/tmp/$2.tape"; \
                } \
             && for tape in demo adopt init check rollback; do \
                  out=demo; [ "$tape" = demo ] || out="demo-$tape"; \
                  render "$tape" "$out" "Catppuccin Mocha"; \
                done \
             && while read -r name theme; do \
                  for tape in demo adopt init check rollback; do \
                    out="demo-$name"; [ "$tape" = demo ] || out="demo-$tape-$name"; \
                    render "$tape" "$out" "$theme"; \
                  done; \
                done < /vhs/demos/palettes.txt'


      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-gif
          path: |
            demos/demo.gif
            demos/demo-*.gif
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: demo-gif
          path: /tmp/gif

      - name: Place GIFs
        run: cp /tmp/gif/demo*.gif demos/

      # Idempotent: an unchanged render commits nothing, so this never
      # loops. main is protected, so changed artifacts land as a PR on a
      # fixed branch (force-pushed, one open PR at a time). Bot PRs don't
      # trigger CI (GITHUB_TOKEN) — merge with the admin override.
      - name: Open artifacts PR if the render changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/demo.gif demos/demo-*.gif
          git diff --cached --quiet && exit 0
          git checkout -B demo/artifacts
          git commit -m "docs: refresh demo GIF"
          git push -f origin demo/artifacts
          title="chore(demo): refresh demo GIF [bot]"
          body="Re-rendered from the demo workflow.

          - rendered from: \`main@${GITHUB_SHA:0:8}\`
          - at: $(date -u '+%Y-%m-%d %H:%M UTC')

          This PR is reused: every render force-pushes demo/artifacts and
          rewrites this body."
          if gh pr view demo/artifacts --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit demo/artifacts --title "$title" --body "$body"
          else
            gh pr create --base main --head demo/artifacts --title "$title" --body "$body"
          fi

