name: mac-seatbelt-diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-startup-diagnosis:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require native Mac ARM
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"
      - name: Build the actual process tests
        run: cargo test --locked -p gripsack-process --no-run
      - name: Observe confined startup and collect native crash causes
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time

          started = time.time()
          service = f"gui/{os.getuid()}/com.apple.ReportCrash"
          subprocess.run(["launchctl", "enable", service], check=False)
          result = subprocess.run(
              ["cargo", "test", "--locked", "-p", "gripsack-process",
               "tests::confinement", "--", "--nocapture", "--test-threads=1"],
              timeout=300,
              check=False,
          )
          print(f"CONFINED_PROCESS_TEST_STATUS={result.returncode}", flush=True)
          directories = [Path.home() / "Library/Logs/DiagnosticReports",
                         Path("/Library/Logs/DiagnosticReports")]
          reports = []
          for attempt in range(15):
              reports = [path for directory in directories if directory.exists()
                         for path in directory.glob("*.ips")
                         if path.stat().st_mtime >= started - 1]
              if len(reports) >= 3:
                  break
              time.sleep(1)
          decoder = json.JSONDecoder()
          for path in sorted(reports):
              if path.stat().st_size > 16 * 1024 * 1024:
                  print(f"CRASH_REPORT_TOO_LARGE={path.name}")
                  continue
              text = path.read_text()
              objects = []
              while text.strip():
                  item, end = decoder.raw_decode(text.lstrip())
                  objects.append(item)
                  text = text.lstrip()[end:]
              for report in objects:
                  if not isinstance(report, dict) or "exception" not in report:
                      continue
                  summary = {key: report.get(key) for key in (
                      "procName", "procPath", "parentProc", "exception", "termination",
                      "asi", "faultingThread", "translated", "codeSigningID")}
                  index = report.get("faultingThread")
                  threads = report.get("threads", [])
                  if isinstance(index, int) and 0 <= index < len(threads):
                      summary["frames"] = threads[index].get("frames", [])[:20]
                      images = report.get("usedImages", [])
                      summary["frameImages"] = {
                          frame["imageIndex"]: {
                              key: images[frame["imageIndex"]].get(key)
                              for key in ("name", "path", "arch")}
                          for frame in summary["frames"]
                          if isinstance(frame.get("imageIndex"), int)
                          and 0 <= frame["imageIndex"] < len(images)}
                  print("MAC_CRASH_CAUSE=" + json.dumps(summary, sort_keys=True))
          print(f"MAC_CRASH_REPORTS_FOUND={len(reports)}", flush=True)
          predicate = ('(process == "kernel" AND eventMessage CONTAINS "Sandbox") '
                       'OR process == "sandboxd" '
                       'OR subsystem == "com.apple.sandbox.reporting"')
          with tempfile.TemporaryFile() as output:
              status = subprocess.run(
                  ["sudo", "-n", "/usr/bin/log", "show", "--start",
                   time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(started)), "--debug",
                   "--info", "--style", "compact", "--predicate", predicate],
                  stdout=output, stderr=subprocess.STDOUT, timeout=60, check=False)
              output.seek(0)
              print("SANDBOX_DIAGNOSTICS_STATUS=" + str(status.returncode))
              print(output.read(1024 * 1024).decode(errors="replace"))
          raise SystemExit(result.returncode)
          PY
