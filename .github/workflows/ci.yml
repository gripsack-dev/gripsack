name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      - name: TypeScript frontend tests (deno)
        run: docker compose run --build --rm ts-test

      # Flow tests: real binary + real frontend against fixture env
      # repos, offline (file:// fixtures only).
      - name: E2E (flow suite)

  # macOS behavioral round (plan/0020's queued item): the release
  # matrix builds on macOS; this RUNS the full flow suite there —
  # APFS semantics, case-insensitivity, symlink topology, Gatekeeper
  # quarantine on provisioned runtimes. Native, not docker: macOS
  # runners have no compose story worth the latency.
  e2e-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build grip (debug — the suite's contract)
        run: cargo build

      - name: Prefetch the pinned Deno
        # GRIPSACK_DENO points the suite at one shared runtime, the
        # same trick the docker image uses — without it every test's
        # sandbox would download its own 40MB
        run: |
          curl -fsSL https://github.com/denoland/deno/releases/download/v2.9.6/deno-aarch64-apple-darwin.zip -o /tmp/deno.zip
          echo "213a2f304f04d3c9cb5220669afad138f60a5aab1fe80962abdeb8f35807a472  /tmp/deno.zip" | shasum -a 256 --check
          unzip -q /tmp/deno.zip -d "$HOME/.deno-bin"
          echo "$HOME/.deno-bin" >> "$GITHUB_PATH"
          echo "GRIPSACK_DENO=$HOME/.deno-bin/deno" >> "$GITHUB_ENV"

      - name: E2E (flow suite, native macOS)
        working-directory: e2e
        env:
          GRIPSACK_BIN: ${{ github.workspace }}/target/debug/grip
        run: |
          python3 -m venv .venv
          ./.venv/bin/pytest -q

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a Check run
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # prebuilt binary, not a from-source install: cargo-audit's own
      # dependency tree (old tinyvec) breaks compiling against new
      # runner toolchains — the action's install path failed CI while
      # the audit itself was clean
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
