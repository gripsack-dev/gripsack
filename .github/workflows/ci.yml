name: release-043-native-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-arm-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
      - name: Build the real 0.43 release executable
        run: cargo build --release --locked -p gripsack --bin grip
      - name: Reproduce the old header rejection and qualify the corrected gate
        run: |
          set -euo pipefail
          bin="$PWD/target/release/grip"
          otool -L "$bin"
          if ! otool -L "$bin" | grep -qvE 'libSystem|libiconv|CoreFoundation|Security|SystemConfiguration'; then
            echo 'old release gate unexpectedly accepted the otool header'
            exit 1
          else
            echo 'OLD_RELEASE_GATE_REJECTED_REAL_OTOOL_HEADER=observed'
          fi
          python3 scripts/check_native_binary.py "$bin"
          "$bin" --version
          echo 'NATIVE_MAC_ARM_RELEASE_DEPENDENCY_GATE=passed'
