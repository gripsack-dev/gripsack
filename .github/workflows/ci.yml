name: native-integration-044

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers-and-native-consumers:
    uses: ./.github/workflows/qualify-conda-helper.yml
    with:
      check_pins: false
      include_intel: false
      macos_smoke: |
        cargo build --locked -p gripsack --bin grip
        cargo test --locked -p gripsack-process --lib -- --nocapture
        cargo test --locked -p gripsack-store source_bundle -- --nocapture
        cargo test --locked -p gripsack-buildkit --lib worker:: -- --nocapture
        cargo test --locked -p gripsack-exec native_sealed_macho_launch_preserves_origin_and_extension_closure -- --nocapture
        export GRIP_RUNTIME_BIN="$PWD/target/debug/grip"
        python3 scripts/qualify_conda_native.py
  native-vz-lifecycle:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require native Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.0'
      - name: Build exact native bridge
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -fsSL --max-time 180 -o "$RUNNER_TEMP/go.tar.gz" https://go.dev/dl/go1.26.3.darwin-arm64.tar.gz
          printf '%s  %s\n' 875cf54a15311eee2c99b9dd67c68c4a49351d489ab622bf2cfd28c8f2078d3c "$RUNNER_TEMP/go.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/go/bin:$PATH" GOTOOLCHAIN=local GOFLAGS=-mod=readonly CGO_ENABLED=0
          (cd tools/buildkit-bridge && go build -trimpath -buildvcs=false -ldflags="-buildid=" -o "$RUNNER_TEMP/bridge" .)
          printf '%s  %s\n' c6d08934df6da46f9681796a8487f78f074440c35db442a3e9ac49af7dff41bb "$RUNNER_TEMP/bridge" | shasum -a 256 -c -
      - name: Require actual owned VZ solve and lifecycle
        env:
          GRIPSACK_BUILDKIT_TEST_BRIDGE: ${{ runner.temp }}/bridge
        run: cargo test --locked -p gripsack-buildkit --lib owned_lima_checked_solve_cache_and_lifecycle -- --ignored --nocapture
