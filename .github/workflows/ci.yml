name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      - name: TypeScript frontend tests (deno)
        run: docker compose run --build --rm ts-test

      # Flow tests: real binary + real frontend against fixture env
      # repos, offline (file:// fixtures only).
      - name: E2E (flow suite)
        run: docker compose run --build --rm e2e

      # the TLA+ spec of the journal protocol, model-checked (0028)
      - name: Transaction model (TLC)
        run: docker compose run --build --rm model

      # the policy kernels, machine-proven + mutant-calibrated (0046);
      # part of the REQUIRED gate so proofs cannot fail optionally
      - name: Policy kernels (Verus)
        run: docker compose run --build --rm verify

  # macOS behavioral round (plan/0020's queued item): the release
  # matrix builds on macOS; this RUNS the full flow suite there —
  # APFS semantics, case-insensitivity, symlink topology, Gatekeeper
  # quarantine on provisioned runtimes. Native, not docker: macOS
  # runners have no compose story worth the latency.
  e2e-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Exact toolchain pin (plan/0042 F): the same rustc the
      # digest-pinned rust:alpine builder compiles with — 1.98.0
      # (88d9e12ae 2026-08-18). Bumps are deliberate, proposed by
      # scripts/check_pins.py; never a floating "stable".
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build grip (debug — the suite's contract)
        run: cargo build

      - name: Prefetch the pinned Deno
        # GRIPSACK_DENO points the suite at one shared runtime, the
        # same trick the docker image uses — without it every test's
        # sandbox would download its own 40MB
        run: |
          curl -fsSL https://github.com/denoland/deno/releases/download/v2.9.6/deno-aarch64-apple-darwin.zip -o /tmp/deno.zip
          echo "213a2f304f04d3c9cb5220669afad138f60a5aab1fe80962abdeb8f35807a472  /tmp/deno.zip" | shasum -a 256 --check
          unzip -q /tmp/deno.zip -d "$HOME/.deno-bin"
          echo "$HOME/.deno-bin" >> "$GITHUB_PATH"
          echo "GRIPSACK_DENO=$HOME/.deno-bin/deno" >> "$GITHUB_ENV"

      - name: E2E (flow suite, native macOS)
        working-directory: e2e
        run: |
          python -m pip install pytest
          python -m pytest -q

  # Bounded, deterministic fuzz replay (plan/0042 E): the checked-in
  # seed corpus through the real targets, OS-contained by bubblewrap —
  # fail-closed, no uncontained fallback. Longer coverage-guided runs
  # are scheduled in fuzz.yml, not here.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Replay the fuzz corpus (bounded container)
        run: docker compose run --build --rm fuzz

  # Executable docs gate (plan/0042 E): the important published TS
  # examples are extracted from the WEBSITE source and evaluated
  # against the actual packaged frontend/core with offline fixtures —
  # no manually-maintained shadow copy. --selfcheck proves the harness
  # fails on a deliberately broken example (negative calibration, the
  # same pattern as the model gate's failing configs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the website source (doc/*.md) — the examples' home
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gripsack-dev/gripsack-dev.github.io
          path: site

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2

      - name: Build the candidate npm package (release workflow commands)
        # npm ci → tsc (npm run build) → npm pack: exactly what
        # release-typescript.yml ships, so CI tests the same artifact
        # shape the registry serves (0.40: src/ for types, dist/ for
        # the Deno pin — node_modules never type-strips)
        run: |
          cd typescript
          npm ci --no-audit --no-fund
          npm run build
          echo "SDK=$PWD/$(npm pack --silent)" >> "$GITHUB_ENV"

      - name: Evaluate published examples against the packaged frontend + real core
        run: |
          cargo build -p gripsack
          python3 scripts/check_examples.py --site site --core-repo . \
            --grip target/debug/grip --deno "$(which deno)" \
            --sdk "$SDK" --selfcheck

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a Check run
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # prebuilt binary, not a from-source install: cargo-audit's own
      # dependency tree (old tinyvec) breaks compiling against new
      # runner toolchains — the action's install path failed CI while
      # the audit itself was clean
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - run: cargo audit
