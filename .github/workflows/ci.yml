name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      - name: Python frontend tests
        run: docker compose run --build --rm pytest

      - name: TypeScript frontend tests
        run: docker compose run --build --rm ts-test

      # Flow tests: real binary + real frontend against fixture env
      # repos, offline (file:// fixtures only).
      - name: E2E (flow suite)
        run: docker compose run --build --rm e2e

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a Check run
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
