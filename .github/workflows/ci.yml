name: ci

on:
  workflow_dispatch:
    inputs:
      fuzz_waiver:
        description: "Explicit owner-approved fuzz/corpus-replay waiver; all other gates remain mandatory"
        type: choice
        default: none
        options:
          - none
          - REL-FUZZ-2026-09-27
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 0.43 repair: the old single `test` job ran Rust, TS, B0, the full E2E
  # suite and every formal gate SERIALLY — run 36774936349 died at the 6h
  # job timeout inside E2E (~66%, before the persistence matrix finished and
  # before model/TLAPS/Verus ever started). The lanes below run in parallel;
  # `test` remains the protected required check as an aggregate that cannot
  # go green unless every lane succeeded (never skipped/failed/cancelled).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Delivery validation and calibration live in a lane the required
      # `test` aggregate admits — never only in an optional sibling job.
      - name: Delivery inventory and closure calibration
        run: |
          python3 scripts/check_delivery.py --validate
          python3 scripts/delivery_checker_calibration.py

      - name: A1 dependency direction (calibrated)
        run: python3 scripts/check_architecture.py --self-check

      - name: Rust gate (fmt, clippy, tests)
        run: docker compose run --build --rm test

      - name: TypeScript frontend tests (deno)
        run: docker compose run --build --rm ts-test

      - name: Production bridge release artifacts and pins
        run: tools/buildkit-bridge/dist.sh --check --dist dist

      # B0's qualification is a real Go client against disposable
      # digest-pinned BuildKit workers. Keep it in the required core lane,
      # not an optional docs/probe job; any failed verifier/load aborts.
      - name: B0 Linux BuildKit qualification
        run: |
          sh verification/buildkit-qualification/bridge/build.sh
          sh verification/buildkit-qualification/probes.sh

  # Flow tests: real binary + real frontend against fixture env
  # repos, offline (file:// fixtures only). The persistence matrix has
  # its own sharded lane below; this lane runs every other flow test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: E2E (flow suite)
        env:
          GRIPSACK_CORPUS_WAIVED: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_waiver == 'REL-FUZZ-2026-09-27' }}
        run: |
          extra=()
          if [ "$GRIPSACK_CORPUS_WAIVED" = true ]; then
            extra+=(--ignore=test_golden.py)
            echo "Owner-waived: golden IR corpus replay not run"
          fi
          docker compose run --build --rm e2e uv run --locked --no-sync pytest --ignore=test_persistence_matrix.py "${extra[@]}"

  # Linux: every scenario x fault runs eight disjoint round-robin cut
  # partitions. Each partition retains both drift states and real recovery;
  # the required aggregate checks their complete measured inventory union.
  e2e-persistence:
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        scenario: [apply-deploy, apply-prune, rollback-deploy, rollback-prune, apply-deploy-copy, apply-prune-copy]
        fault: [error, kill]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GRIPSACK_PERSISTENCE_SHARD: ${{ matrix.shard }}
      GRIPSACK_PERSISTENCE_SHARDS: "8"
      GRIPSACK_PERSISTENCE_REPORTS: ${{ github.workspace }}/persistence-reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: E2E (Linux persistence shard)
        run: |
          mkdir -p "$GRIPSACK_PERSISTENCE_REPORTS"
          docker compose run --build --rm \
            -e GRIPSACK_PERSISTENCE_SHARD -e GRIPSACK_PERSISTENCE_SHARDS \
            -e GRIPSACK_PERSISTENCE_REPORTS=/persistence-reports -e GITHUB_SHA \
            -v "$GRIPSACK_PERSISTENCE_REPORTS:/persistence-reports" \
            e2e uv run --locked --no-sync pytest -s "test_persistence_matrix.py::test_every_reachable_persistence_boundary[${{ matrix.scenario }}-${{ matrix.fault }}]"
      - name: Publish completed persistence partition
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persistence-${{ matrix.platform }}-${{ matrix.scenario }}-${{ matrix.fault }}-${{ matrix.shard }}
          path: persistence-reports/*.json
          if-no-files-found: error

  formal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [model, tlaps, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Required formal gate (${{ matrix.gate }})
        run: docker compose run --build --rm "${{ matrix.gate }}"

  # Protected required check: pure aggregate over the parallel lanes.
  # if: always() plus an explicit per-lane result admission — a failed,
  # cancelled or skipped lane can never let this go green.
  test:
    if: always()
    needs: [core, e2e, e2e-persistence, formal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: persistence-*
          path: persistence-reports
      - name: Calibrate complete required-work admission
        run: python3 scripts/check_ci_gate.py --self-check
      - name: Admit every required lane
        env:
          GRIPSACK_TEST_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_gate.py --test-lanes --persistence-reports persistence-reports

  # Bounded, deterministic fuzz replay (plan/0042 E): the checked-in
  # seed corpus through the real targets, OS-contained by bubblewrap —
  # fail-closed, no uncontained fallback. Longer coverage-guided runs
  # are scheduled in fuzz.yml, not here.
  fuzz:
    # Only explicit manual feedback dispatches may omit this lane. Unknown
    # waiver inputs also omit execution, but the final gate rejects them.
    if: github.event_name != 'workflow_dispatch' || inputs.fuzz_waiver == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Replay the fuzz corpus (bounded container)
        run: docker compose run --build --rm fuzz

  # Executable docs gate (plan/0042 E): the important published TS
  # examples are extracted from the WEBSITE source and evaluated
  # against the actual packaged frontend/core with offline fixtures —
  # no manually-maintained shadow copy. --selfcheck proves the harness
  # fails on a deliberately broken example (negative calibration, the
  # same pattern as the model gate's failing configs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the website source (doc/*.md) — the examples' home
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gripsack-dev/gripsack-dev.github.io
          path: site

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2

      - name: Build the candidate npm package (release workflow commands)
        # npm ci → tsc (npm run build) → npm pack: exactly what
        # release-typescript.yml ships, so CI tests the same artifact
        # shape the registry serves (0.40: src/ for types, dist/ for
        # the Deno pin — node_modules never type-strips)
        run: |
          cd typescript
          npm ci --no-audit --no-fund
          npm run build
          echo "SDK=$PWD/$(npm pack --silent)" >> "$GITHUB_ENV"

      - name: Evaluate published examples against the packaged frontend + real core
        run: |
          cargo build -p gripsack
          python3 scripts/check_examples.py --site site --core-repo . \
            --grip target/debug/grip --deno "$(which deno)" \
            --sdk "$SDK" --selfcheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # prebuilt binary, not a from-source install: cargo-audit's own
      # dependency tree (old tinyvec) breaks compiling against new
      # runner toolchains — the action's install path failed CI while
      # the audit itself was clean
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo audit --file tools/conda-helper/Cargo.lock

  gate:
    if: always()
    needs: [test, docs, audit, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Calibrate required-result admission
        run: python3 scripts/check_ci_gate.py --self-check
      - name: Admit every required lane
        env:
          GRIPSACK_CI_RESULTS: ${{ toJSON(needs) }}
          GRIPSACK_CI_EVENT: ${{ github.event_name }}
          GRIPSACK_FUZZ_WAIVER: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_waiver || 'none' }}
        run: python3 scripts/check_ci_gate.py
