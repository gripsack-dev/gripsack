name: mac-worker-platform-diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-platform:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Measure native architecture and virtualization facilities
        run: |
          python3 - <<'PY'
          import json
          import platform
          import shutil
          import subprocess
          assert platform.machine() == 'arm64'
          report = {'architecture': platform.machine(),
                    'tools': {name: shutil.which(name) for name in ('limactl', 'qemu-system-aarch64')}}
          for name, command in (
              ('hypervisor', ['sysctl', 'kern.hv_support']),
              ('operating_system', ['sw_vers']),
          ):
              result = subprocess.run(command, capture_output=True, text=True, timeout=30)
              report[name] = {'status': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr}
          result = subprocess.run(['brew', 'info', 'lima', 'qemu', '--json=v2'],
                                  capture_output=True, text=True, timeout=90)
          report['brew_status'] = result.returncode
          if result.returncode == 0:
              info = json.loads(result.stdout)
              report['formulae'] = [{key: formula.get(key) for key in ('name', 'versions', 'installed', 'bottle')}
                                   for formula in info.get('formulae', [])]
          else:
              report['brew_error'] = result.stderr[-4096:]
          print('MAC_WORKER_PLATFORM=' + json.dumps(report, sort_keys=True))
          PY
