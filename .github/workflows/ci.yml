name: native-mac-worker-qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-worker:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require native Mac ARM
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"
      - name: Native worker ownership and identity admission
        run: |
          cargo test --locked -p gripsack-buildkit --lib worker::lima::tests -- --nocapture
      - name: Provision the exact native Go compiler
        run: |
          curl -fsSL --max-time 180 https://go.dev/dl/go1.26.3.darwin-arm64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          printf '%s  %s\n' 875cf54a15311eee2c99b9dd67c68c4a49351d489ab622bf2cfd28c8f2078d3c "$RUNNER_TEMP/go.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Build the exact pinned native bridge
        working-directory: tools/buildkit-bridge
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=readonly"
          GOTOOLCHAIN: "local"
        run: |
          go version
          go build -trimpath -buildvcs=false -ldflags="-buildid=" -o "$RUNNER_TEMP/grip-buildkit-bridge" .
          printf '%s  %s\n' c6d08934df6da46f9681796a8487f78f074440c35db442a3e9ac49af7dff41bb "$RUNNER_TEMP/grip-buildkit-bridge" | shasum -a 256 -c -
          echo "GRIPSACK_BUILDKIT_TEST_BRIDGE=$RUNNER_TEMP/grip-buildkit-bridge" >> "$GITHUB_ENV"
      - name: Exercise actual owned worker provisioning and lifecycle
        run: |
          cargo test --locked -p gripsack-buildkit --lib owned_lima_checked_solve_cache_and_lifecycle -- --ignored --nocapture
