name: audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # prebuilt binary, not a from-source install: cargo-audit's own
      # dependency tree (old tinyvec) breaks compiling against new
      # runner toolchains — the action's install path failed CI while
      # the audit itself was clean
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo audit --file tools/conda-helper/Cargo.lock
