name: release-core

# Publication is manual and GitHub-only. This workflow never builds, signs,
# uploads packages to registries, or promotes a Homebrew formula.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual publication authority
        run: |
          echo 'No publication performed.'
          echo 'Follow verification/release-handoff.md: qualify locally, then explicitly publish the exact unsigned artifacts using gh release create/upload.'
          echo 'Do not rebuild a qualified candidate or infer signed/hosted qualification from this workflow.'
