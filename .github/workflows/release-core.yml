name: release-core

# Publication is manual, local and GitHub-only: this workflow never builds,
# signs, or uploads anything. Its path stays because the installer/self-update
# verifier names it as the (future) attestation signer identity.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual publication
        run: |
          echo 'No publication performed.'
          echo 'Qualify locally (python3 -m ci_infra qualify <checkout>), then on the host:'
          echo '  python3 scripts/release.py status <candidate_id>'
          echo '  python3 scripts/release.py publish <candidate_id> --notes NOTES.md'
