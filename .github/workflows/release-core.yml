name: release-core

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: write

# Two core tags cut at once (0.4.1 + 0.5.0) raced the homebrew-tap
# push and one lost — serialize; the newer tag waits.
concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  # Per-platform binaries (linux + macOS, both arch variants — Windows
  # is out by design, WSL is the story there). The docker musl path
  # needs no cross config: rust:alpine is multi-arch, so the same
  # build produces aarch64 musl natively on the arm runner.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, docker: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, docker: true }
          # both darwin targets on the arm runner — x86_64 cross-compiles
          # with the stock Xcode (no macos-13 queue, which can idle 20-60min)
          - { target: x86_64-apple-darwin, runner: macos-14, cross: true }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (linux musl, docker)
        if: matrix.docker
        run: |
          docker compose run --build --rm \
            -e "VERSION=${GITHUB_REF_NAME#core-v}" \
            -e "TARGET=${{ matrix.target }}" release

      - name: Build (macOS, native)
        if: "!matrix.docker"
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} -p gripsack
          VERSION="${GITHUB_REF_NAME#core-v}"
          PKG="gripsack-$VERSION-${{ matrix.target }}"
          staging="$(mktemp -d)"
          mkdir -p "$staging/$PKG"
          install -m755 "target/${{ matrix.target }}/release/grip" "$staging/$PKG/grip"
          mkdir -p dist
          tar -czf "dist/$PKG.tar.gz" -C "$staging" "$PKG"
          (cd dist && shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256")

      - name: "Verify binary (linux: must be fully static)"
        if: matrix.docker
        run: |
          cd dist
          sha256sum -c gripsack-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf gripsack-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name grip | head -1)"
          file "$bin"
          ! ldd "$bin" 2>&1 | grep -q "=>"
          "$bin" --version

      - name: "Verify binary (macOS: system libs only)"
        if: "!matrix.docker"
        run: |
          cd dist
          shasum -a 256 -c gripsack-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf gripsack-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name grip | head -1)"
          file "$bin"
          otool -L "$bin"
          ! otool -L "$bin" | grep -qvE "libSystem|libiconv|CoreFoundation|Security|SystemConfiguration"
          "$bin" --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble artifacts
        run: |
          mkdir -p dist
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify all four tarballs are present
        run: |
          ls -la dist/
          count="$(ls dist/gripsack-*.tar.gz | wc -l)"
          test "$count" -eq 4 || {
            echo "::error::expected 4 platform tarballs, got $count"; exit 1; }

      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version.
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pkg="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gripsack") | .version')"
          test "core-v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version core-v$pkg"; exit 1; }
          # the workspace publishes in dependency order; the retry loop
          # absorbs index lag and crates.io's new-crate rate limit.
          # re-runs tolerate "already exists"; anything else fails loudly.
          failed=""
          for crate in gripsack-ir gripsack-store gripsack-fetch gripsack-config \
                       gripsack-lint griplint gripsack-trace gripsack-exec gripsack; do
            ok=""
            for attempt in 1 2 3 4 5; do
              if out="$(cargo publish -p "$crate" 2>&1)"; then
                ok=1; break
              fi
              echo "$out" | tail -5
              if echo "$out" | grep -q "already exists"; then
                echo "$crate already published — skipping"; ok=1; break
              fi
              echo "::warning::publish of $crate failed (attempt $attempt); backing off"
              sleep 60
            done
            [ -n "$ok" ] || failed="$failed $crate"
          done
          [ -z "$failed" ] || { echo "::error::failed to publish:$failed"; exit 1; }

      # Keep the tap in sync: bump the formula's version + crate sha256.
      # Needs HOMEBREW_TAP_TOKEN (fine-grained PAT, contents:write on
      # gripsack-dev/homebrew-tap) — GITHUB_TOKEN is repo-scoped.
      - name: Bump homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.HAS_TAP_TOKEN != ''
        run: |
          ver="${GITHUB_REF_NAME#core-v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/gripsack/gripsack-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone gripsack-dev/homebrew-tap /tmp/tap -- --depth 1
          sed -i -e "s|gripsack-[0-9.]*\.crate|gripsack-$ver.crate|" \
                 -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" \
                 /tmp/tap/Formula/gripsack.rb
          # the cask: prebuilt per-arch binaries (no rust toolchain on
          # the user's machine — the better macOS path, uv/pixi-class)
          mkdir -p /tmp/tap/Casks
          sha_arm="$(cut -d' ' -f1 "dist/gripsack-$ver-aarch64-apple-darwin.tar.gz.sha256")"
          sha_x64="$(cut -d' ' -f1 "dist/gripsack-$ver-x86_64-apple-darwin.tar.gz.sha256")"
          cat > /tmp/tap/Casks/gripsack.rb <<EOF
          cask "gripsack" do
            version "$ver"

            arch arm: "aarch64", intel: "x86_64"
            sha256 arm: "$sha_arm", intel: "$sha_x64"

            url "https://github.com/gripsack-dev/gripsack/releases/download/core-v#{version}/gripsack-#{version}-#{arch}-apple-darwin.tar.gz"
            name "gripsack"
            desc "your whole environment in one bag"
            homepage "https://gripsack.dev"

            binary "gripsack-#{version}-#{arch}-apple-darwin/grip", target: "grip"
          end
          EOF

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gripsack.rb Casks/gripsack.rb
          git commit -m "gripsack $ver"
          git push "https://x-access-token:${GH_TOKEN}@github.com/gripsack-dev/homebrew-tap.git" HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "gripsack ${GITHUB_REF_NAME#core-v}" \
            --generate-notes

      # The site's version chip reads the releases API at build time —
      # a rebuild dispatch keeps gripsack.dev current (rootle pattern).
      # Non-fatal while SITE_REPO_TOKEN is unset — it must never fail a release.
      - name: Ping the site to redeploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api repos/gripsack-dev/gripsack-dev.github.io/dispatches \
            -f event_type=rebuild
