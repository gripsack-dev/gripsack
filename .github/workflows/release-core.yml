name: release-core

on:
  # Dispatch against an existing core-v* tag when its commit deliberately
  # skipped automatic CI. The tag and its source stay immutable.
  workflow_dispatch:
  push:
    tags: ["core-v*"]
permissions:
  contents: write
  # artifact attestations (plan/0020 §5.8): the release tarballs get
  # a signed provenance statement GitHub can verify client-side
  id-token: write
  attestations: write

# Two core tags cut at once (0.4.1 + 0.5.0) raced the homebrew-tap
# push and one lost — serialize; the newer tag waits.
concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  conda:
    uses: ./.github/workflows/qualify-conda-helper.yml
    with:
      check_pins: true

  # The BuildKit bridge helper the pinned core provisions lazily:
  # deterministic per-platform artifacts from the pinned Go image,
  # verified byte-exact against the committed pins the core embeds
  # (crates/gripsack-fetch/src/bridge_pins.rs). Drift — or an empty pin
  # table — fails HERE, before any core binary is built: a release can
  # never pair core bytes with unverified helper bytes.
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and pin-check helper artifacts
        run: VERSION="${GITHUB_REF_NAME#core-v}" tools/buildkit-bridge/dist.sh --check --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-bridge
          path: dist/*
  # REL-X64-FIRST-0460-2026-10-08: this release qualifies Linux x86_64 only.
  # ARM artifacts remain unavailable until a subsequent native qualification.
  build:
    needs: [bridge, conda]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # plan/0022: shipped binaries embed their dependency tree
      # (cargo-auditable); the verify step below audits the SHIPPED
      # binary itself (cargo audit bin), proving the embed landed on
      # the exact artifact users download. Prebuilt installs only —
      # from-source tool builds break on new toolchains (audit.yml's
      # lesson).
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - name: Build (linux musl, docker)
        run: |
          docker compose run --build --rm \
            -e "VERSION=${GITHUB_REF_NAME#core-v}" \
            -e "TARGET=${{ matrix.target }}" release

      - name: "Verify binary (linux: must be fully static)"
        run: |
          cd dist
          sha256sum -c gripsack-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf gripsack-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name grip | head -1)"
          file "$bin"
          python3 ../scripts/check_native_binary.py "$bin"
          "$bin" --version
          # fails the release if the SBOM embed is missing or the
          # shipped tree hits an advisory (plan/0022 §2)
          cargo audit bin "$bin"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assemble artifacts
        run: |
          mkdir -p dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify exact Linux release inventory and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("core-v")
          targets = {"x86_64-unknown-linux-musl"}
          dist = Path("dist")
          core = {f"gripsack-{version}-{target}.tar.gz" for target in targets}
          bridge = {f"grip-buildkit-bridge-{version}-{target}" for target in targets}
          conda = {f"gripsack-conda-{version}-{target}" for target in targets}
          payloads = core | bridge | conda
          expected = payloads | {f"{name}.sha256" for name in payloads}
          expected |= {f"{name}.{suffix}" for name in conda
                       for suffix in ("manifest.json", "LICENSE-pixi", "LICENSE-UV-MIT")}
          actual = {path.name for path in dist.iterdir()}
          if actual != expected or any(not path.is_file() for path in dist.iterdir()):
              raise SystemExit(f"Release assets differ: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}")
          for name in sorted(payloads):
              digest = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if (dist / f"{name}.sha256").read_text() != f"{digest}  {name}\n":
                  raise SystemExit(f"Release sidecar mismatch: {name}")
          for name in sorted(conda):
              digest = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              manifest = json.loads((dist / f"{name}.manifest.json").read_text())
              if manifest["asset"] != name or manifest["sha256"] != digest or manifest["reproducible_rounds"] != 2:
                  raise SystemExit(f"Conda measurement manifest mismatch: {name}")
              for suffix, source in (("LICENSE-pixi", "LICENSE"), ("LICENSE-UV-MIT", "LICENSE-UV-MIT")):
                  notice = f"{name}.{suffix}"
                  contents = (dist / notice).read_bytes()
                  if contents != (Path("tools/conda-helper/vendor/pixi_git") / source).read_bytes() or manifest["licenses"].get(notice) != hashlib.sha256(contents).hexdigest():
                      raise SystemExit(f"Conda license notice mismatch: {notice}")
          PY

      # signed build provenance for every tarball (plan/0020 §5.8):
      # verifiable with `gh attestation verify <file> -R gripsack-dev/gripsack`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gripsack-*.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/grip-buildkit-bridge-*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gripsack-conda-*-unknown-linux-musl
      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.0"

      - name: Publish to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pkg="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gripsack") | .version')"
          test "core-v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version core-v$pkg"; exit 1; }
          # the workspace publishes in dependency order; the retry loop
          # absorbs crates.io's new-crate rate limit. A sibling-
          # dependency miss is sparse-index lag: poll the index for
          # THAT version instead of burning blind retries — a fixed
          # budget lost to index lag on the 0.42.0 policy→ir hop.
          # re-runs tolerate "already exists"; anything else fails loudly.
          failed=""
          for crate in gripsack-fs gripsack-policy gripsack-ir gripsack-process \
                       griplint gripsack-config gripsack-store gripsack-fetch \
                       gripsack-trace gripsack-buildkit gripsack-conda gripsack-lint \
                       gripsack-exec gripsack; do
            ok=""
            for attempt in $(seq 1 12); do
              if out="$(cargo publish -p "$crate" 2>&1)"; then
                ok=1; break
              fi
              echo "$out" | tail -5
              if echo "$out" | grep -q "already exists"; then
                echo "$crate already published — skipping"; ok=1; break
              fi
              echo "::warning::publish of $crate failed (attempt $attempt); backing off"
              miss="$(echo "$out" | grep -o 'requirement `gripsack[A-Za-z-]* = "[^"]*"' | head -1 || true)"
              if [ -n "$miss" ]; then
                dep="$(echo "$miss" | cut -d'`' -f2 | cut -d' ' -f1)"
                want="$(echo "$miss" | grep -o '[0-9][0-9.]*[0-9]')"
                case ${#dep} in
                  1) ipath="1/$dep";;
                  2) ipath="2/$dep";;
                  3) ipath="3/$(printf '%s' "$dep" | cut -c1)/$dep";;
                  *) ipath="$(printf '%s' "$dep" | cut -c1-2)/$(printf '%s' "$dep" | cut -c3-4)/$dep";;
                esac
                for poll in $(seq 1 40); do
                  if curl -fsSL "https://index.crates.io/$ipath" 2>/dev/null \
                     | grep -q "\"vers\":\"$want\""; then
                    echo "index sees $dep $want"; break
                  fi
                  [ "$poll" = 40 ] && echo "::warning::index still missing $dep $want"
                  sleep 30
                done
              else
                sleep 90
              fi
            done
            [ -n "$ok" ] || failed="$failed $crate"
          done
          [ -z "$failed" ] || { echo "::error::failed to publish:$failed"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "gripsack ${GITHUB_REF_NAME#core-v}" \
            --generate-notes

      # Keep the tap in sync: bump the formula's version + crate sha256.
      # Needs HOMEBREW_TAP_TOKEN (fine-grained PAT, contents:write on
      # gripsack-dev/homebrew-tap) — GITHUB_TOKEN is repo-scoped.
      - name: Bump homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.HAS_TAP_TOKEN != ''
        run: |
          ver="${GITHUB_REF_NAME#core-v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/gripsack/gripsack-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone gripsack-dev/homebrew-tap /tmp/tap -- --depth 1
          sed -i -e "s|gripsack-[0-9.]*\.crate|gripsack-$ver.crate|" \
                 -e "s|sha256 \"[0-9a-f]*\"|sha256 \"$sha\"|" \
                 /tmp/tap/Formula/gripsack.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gripsack.rb
          git commit -m "gripsack $ver"
          git push "https://x-access-token:${GH_TOKEN}@github.com/gripsack-dev/homebrew-tap.git" HEAD:main

      # The site's version chip reads the releases API at build time —
      # a rebuild dispatch keeps gripsack.dev current (rootle pattern).
      # Non-fatal while SITE_REPO_TOKEN is unset — it must never fail a release.
      - name: Ping the site to redeploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api repos/gripsack-dev/gripsack-dev.github.io/dispatches \
            -f event_type=rebuild
