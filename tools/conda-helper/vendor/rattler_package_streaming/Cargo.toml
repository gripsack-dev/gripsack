# Published rattler_package_streaming 0.27.8, retaining every Rust source file.
# Production delta: ZIP 9 requirement and the read.rs/seek.rs API changes from
# upstream commit 5e544a615715598004ba883bf63fb40d06c19b3f, with one deliberate
# stricter adaptation: seek.rs propagates filename decoding errors through
# ExtractError instead of upstream's filter_map(Result::ok) discarding them.
# Registry-generated manifest retained; upstream README/changelog, unused lock,
# original workspace manifest and Cargo cache metadata are not vendored.

[package.metadata.gripsack-vendor]
crate-url = "https://static.crates.io/crates/rattler_package_streaming/rattler_package_streaming-0.27.8.crate"
crate-sha256 = "9bbaeb8cdf160f7a2dfdc55a55bdde754c1fa65f14cc16d30c93eb4e4c4b1d61"
source-revision = "35e6566d2371cf6d7a841536505f4514ee91ef24"
upstream-patch = "https://github.com/conda/rattler/commit/5e544a615715598004ba883bf63fb40d06c19b3f"
license-source = "https://github.com/conda/rattler/blob/35e6566d2371cf6d7a841536505f4514ee91ef24/LICENSE"

[package]
edition = "2024"
name = "rattler_package_streaming"
version = "0.27.8"
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>"]
build = false
exclude = [
    "tests/**",
    "benches/**",
    "**/snapshots/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extract and stream of Conda package archives"
homepage = "https://github.com/conda/rattler"
categories = ["development-tools"]
license = "BSD-3-Clause"
repository = "https://github.com/conda/rattler"
resolver = "2"

[package.metadata.docs.rs]
features = ["reqwest"]

[features]
default = ["rustls"]
native-tls = [
    "rattler_networking/native-tls",
    "rattler_redaction/native-tls",
]
reqwest = [
    "dep:reqwest-middleware",
    "dep:reqwest",
    "dep:fs-err",
    "dep:http",
    "dep:async_http_range_reader",
]
rustls = [
    "rattler_networking/rustls",
    "rattler_redaction/rustls",
]
wasm = ["zstd/wasm"]

[lib]
name = "rattler_package_streaming"
path = "src/lib.rs"

[dependencies.astral-tokio-tar]
version = "0.6"

[dependencies.astral_async_zip]
version = "0.0.21"
features = [
    "deflate",
    "tokio",
    "tokio-fs",
]
default-features = false

[dependencies.async-compression]
version = "0.4"
features = [
    "gzip",
    "tokio",
    "bzip2",
    "zstd",
]

[dependencies.async_http_range_reader]
version = "0.11"
optional = true
package = "astral_async_http_range_reader"

[dependencies.bytes]
version = "1"

[dependencies.bzip2]
version = "0.6"

[dependencies.filetime]
version = "0.2"

[dependencies.fs-err]
version = "3"
features = ["tokio"]
optional = true

[dependencies.futures]
version = "0.3"

[dependencies.futures-util]
version = "0.3"

[dependencies.hex]
version = "0.4"

[dependencies.http]
version = "1"
optional = true

[dependencies.jiff]
version = "0.2"
features = [
    "std",
    "serde",
]
default-features = false

[dependencies.rattler_conda_types]
version = "=0.55.0"
default-features = false

[dependencies.rattler_digest]
version = "=2.0.0"
features = ["tokio"]
default-features = false

[dependencies.rattler_networking]
version = "=0.31.0"
default-features = false

[dependencies.rattler_redaction]
version = "=0.2.6"
features = [
    "reqwest",
    "reqwest-middleware",
]
default-features = false

[dependencies.reqwest]
version = "0.13"
features = [
    "stream",
    "http2",
]
optional = true
default-features = false

[dependencies.reqwest-middleware]
version = "0.5"
optional = true
package = "astral-reqwest-middleware"

[dependencies.serde_json]
version = "1"

[dependencies.simple_spawn_blocking]
version = "1.1"
features = ["tokio"]
default-features = false

[dependencies.tar]
version = "0.4"

[dependencies.tempfile]
version = "3"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["sync"]
default-features = false

[dependencies.tokio-util]
version = "0.7"
features = ["io-util"]

[dependencies.tracing]
version = "0.1"

[dependencies.url]
version = "2"

[dependencies.zip]
version = "9.0.3"
features = [
    "deflate",
    "time",
]
default-features = false

[dependencies.zstd]
version = "0.13"
default-features = false

[dev-dependencies.assert_matches]
version = "1"

[dev-dependencies.async-trait]
version = "0.1"

[dev-dependencies.axum]
version = "0.8"
features = [
    "tokio",
    "http1",
]
default-features = false

[dev-dependencies.fs-err]
version = "3"

[dev-dependencies.insta]
version = "1"
features = ["yaml"]

[dev-dependencies.reqwest]
version = "0.13"
default-features = false

[dev-dependencies.reqwest-middleware]
version = "0.5"
package = "astral-reqwest-middleware"

[dev-dependencies.rstest]
version = "0.26"

[dev-dependencies.rstest_reuse]
version = "0.7"

[dev-dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dev-dependencies.tokio]
version = "1"
features = [
    "rt",
    "macros",
    "rt-multi-thread",
]
default-features = false

[dev-dependencies.tower-http]
version = "0.7"
features = ["fs"]
default-features = false

[dev-dependencies.walkdir]
version = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.num_cpus]
version = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = ["fs"]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zstd]
version = "0.13"
features = ["zstdmt"]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom_v02]
version = "0.2"
features = ["js"]
package = "getrandom"
