# Published rattler_repodata_gateway 0.34.0; library sources retained verbatim.
# Raise only the Zstd requirement for the 2026-10-26 RustSec decoder fixes,
# preserving the coherent Rattler/Pixi type family. Registry-generated manifest
# retained; upstream docs, unused lock and Cargo cache metadata are not vendored.
#
[package.metadata.gripsack-vendor]
crate-url = "https://static.crates.io/crates/rattler_repodata_gateway/rattler_repodata_gateway-0.34.0.crate"
crate-sha256 = "f75726238d7aac9208fb3375e83d99c6ad44a56bd3854efe6b9ee08792f429f7"
source-revision = "35e6566d2371cf6d7a841536505f4514ee91ef24"
security-delta = "Require zstd >=0.14.3; keep the upstream library implementation."
license-source = "https://github.com/conda/rattler/blob/35e6566d2371cf6d7a841536505f4514ee91ef24/LICENSE"

[package]
edition = "2024"
name = "rattler_repodata_gateway"
version = "0.34.0"
authors = ["Bas Zalmstra <zalmstra.bas@gmail.com>"]
build = false
exclude = [
    "benches/**",
    "**/snapshots/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A crate to interact with Conda repodata"
homepage = "https://github.com/conda/rattler"
readme = false
categories = ["development-tools"]
license = "BSD-3-Clause"
repository = "https://github.com/conda/rattler"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "sparse",
    "gateway",
]

[features]
default = ["rustls"]
gateway = [
    "sparse",
    "http",
    "http-cache-semantics",
    "parking_lot",
    "async-trait",
    "rattler_package_streaming",
]
native-tls = [
    "reqwest/native-tls",
    "rattler_networking/native-tls",
    "rattler_cache/native-tls",
    "rattler_redaction/native-tls",
]
rustls = [
    "reqwest/rustls",
    "rattler_networking/rustls",
    "rattler_cache/rustls",
    "rattler_redaction/rustls",
]
sparse = [
    "rattler_conda_types",
    "memmap2",
    "self_cell",
    "superslice",
    "itertools",
    "serde_json/raw_value",
]

[lib]
name = "rattler_repodata_gateway"
path = "src/lib.rs"

[dependencies.ahash]
version = "0.8"

[dependencies.anyhow]
version = "1"

[dependencies.async-compression]
version = "0.4"
features = [
    "gzip",
    "tokio",
    "bzip2",
    "zstd",
    "gzip",
    "tokio",
    "bzip2",
    "zstd",
]

