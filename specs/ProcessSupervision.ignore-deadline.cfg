\* Expected temporal counterexample: blocked input polls forever at Deadline.
SPECIFICATION Spec
CONSTANTS
  Deadline = 3
  Reserve = 1
  InputLimit = 1
  OutputLimit = 2
  LineLimit = 1
  TailLimit = 1
  Mutant = "ignoreDeadline"
INVARIANTS TypeOK BoundedBuffers PidAuthority HonestCleanup
PROPERTY Terminates
CHECK_DEADLOCK TRUE
