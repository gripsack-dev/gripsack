    CurrentAttempt = 1
    CurrentEpoch = 1
    CurrentWorker = "worker-current"
    CurrentWorkerEpoch = 1
    IgnoreIdentity = FALSE
    IgnoreWorker = FALSE
    IgnoreConflict = TRUE
    DoneBeforeExport = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS ConflictRefusal
