 Destinations = {first}
 Transactions = {first}
 GenerationIds = {0,1}
 DefaultGeneration = 0
 Legacy = legacy
 NoSelection = none
 InitialSelection = none
 AvailableGenerations = {}
 SelectionMutant = "none"
 JournalMutant = "none"
 MaxGeneration = 1
 InitialHighWater = 0
 InitialGenerations = {}
 NeedsProfile = {1}
 PublicationMutant = "none"
 IntentCount = 1
