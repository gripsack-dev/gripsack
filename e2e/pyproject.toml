[project]
name = "gripsack-e2e"
version = "0.0.0"
description = "gripsack flow tests — real binary + real frontend, offline"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "requires_fault_controls: exercises fault/trace controls compiled only into debug/test cores",
]
