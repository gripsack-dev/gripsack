[general]
live_config_reload = true

[window]
padding = { x = 3, y = 3 }
dynamic_padding = true
opacity = 0.9
decorations = "Full"

[scrolling]
history = 10000

[font]
normal = { family = "monospace", style = "Regular" }
size = 13.0

[cursor]
style = { shape = "Beam", blinking = "On" }

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

[keyboard]
bindings = [{ key = "V", mods = "Control", action = "Paste" }]
