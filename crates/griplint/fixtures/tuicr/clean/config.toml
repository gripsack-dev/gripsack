theme = "catppuccin-mocha"
appearance = "system"
diff_view = "side-by-side"
ignore_whitespace = false
mouse = true
leader = ";"
comment_vim = false
relative_line_numbers = false
backend = "libgit2"

comment_types = [
    { id = "issue", color = "red", definition = "must fix" },
    { id = "note", color = "blue" },
]
