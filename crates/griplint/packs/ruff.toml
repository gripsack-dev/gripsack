# Data pack for ruff — ported from griplint-py (plan/0012).
# Review on upstream releases; the diff *is* the changelog review.

[meta]
tool = "ruff"
handles = ["pyproject.toml", "ruff.toml"]
format = "toml"
supported = ["0."]
lenient = ["pyproject.toml"]
series = "v0"

[files."pyproject.toml".rules."tool.ruff"]
builtins = { types = ["array"] }
cache-dir = { types = ["string"] }
extend = { types = ["string"] }
extend-exclude = { types = ["array"] }
exclude = { types = ["array"] }
fix = { types = ["boolean"] }
fix-only = { types = ["boolean"] }
force-exclude = { types = ["boolean"] }
indent-width = { types = ["integer"] }
line-length = { types = ["integer"] }
log-file = { types = ["string"] }
namespace-packages = { types = ["array"] }
output-format = { types = ["string"] }
preview = { types = ["boolean"] }
required-version = { types = ["string"] }
respect-gitignore = { types = ["boolean"] }
src = { types = ["array"] }
target-version = { types = ["string"] }
unsafe-fixes = { types = ["boolean"] }
show-fixes = { types = ["boolean"] }
extend-safe-fixes = { types = ["array"] }

[files."pyproject.toml".rules."tool.ruff.lint"]
select = { types = ["array"] }
ignore = { types = ["array"] }
extend-select = { types = ["array"] }
extend-ignore = { types = ["array"] }
fixable = { types = ["array"] }
unfixable = { types = ["array"] }
extend-fixable = { types = ["array"] }
allowed-confusables = { types = ["array"] }
dummy-variable-rgx = { types = ["string"] }
explicit-preview-rules = { types = ["boolean"] }
extend-safe-fixes = { types = ["array"] }
extend-unsafe-fixes = { types = ["array"] }
external = { types = ["array"] }
ignore-init-module-imports = { types = ["boolean"] }
logger-objects = { types = ["array"] }
task-tags = { types = ["array"] }
typing-modules = { types = ["array"] }
future-proofing = { types = ["boolean"] }

[files."pyproject.toml".rules."tool.ruff.format"]
quote-style = { types = ["string"], choices = ["single", "double", "preserve"] }
indent-style = { types = ["string"], choices = ["space", "tab"] }
line-ending = { types = ["string"], choices = ["auto", "lf", "crlf", "cr"] }
skip-magic-trailing-comma = { types = ["boolean"] }
docstring-code-format = { types = ["boolean"] }
docstring-code-line-length = { types = ["string", "integer"] }
preview = { types = ["boolean"] }

