[files."yazi.toml".rules."mgr"]
ratio = { types = ["array"] }
sort_by = { types = ["string"], choices = ["none", "mtime", "btime", "extension", "alphabetical", "natural", "size", "random"] }
sort_sensitive = { types = ["boolean"] }
sort_reverse = { types = ["boolean"] }
sort_dir_first = { types = ["boolean"] }
sort_translit = { types = ["boolean"] }
linemode = { types = ["string"] }
show_hidden = { types = ["boolean"] }
show_symlink = { types = ["boolean"] }
scrolloff = { types = ["integer"] }
mouse_events = { types = ["array"] }

[files."yazi.toml".rules."preview"]
wrap = { types = ["string"], choices = ["yes", "no"] }
tab_size = { types = ["integer"] }
max_width = { types = ["integer"] }
max_height = { types = ["integer"] }
cache_dir = { types = ["string"] }
image_delay = { types = ["integer"] }
image_filter = { types = ["string"], choices = ["nearest", "triangle", "catmull-rom", "lanczos3"] }
image_quality = { types = ["integer"] }
ueberzug_scale = { types = ["integer", "float"] }
ueberzug_offset = { types = ["array"] }

[files."yazi.toml".rules."opener"]
_free = true

[files."yazi.toml".rules."open"]
rules = { types = ["array"] }
