# Data pack for yazi — ported from griplint-py (plan/0012).
# Review on upstream releases; the diff *is* the changelog review.

[meta]
tool = "yazi"
handles = ["keymap.toml", "theme.toml", "yazi.toml"]
format = "toml"
supported = ["25.", "26."]
series = "v0"

[files."keymap.toml".rules."mgr"]
keymap = { types = ["array"] }
