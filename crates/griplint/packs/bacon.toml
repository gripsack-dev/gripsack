hide_scrollbar = { types = ["boolean"] }
kill = { types = ["array"] }
ignore = { types = ["array"] }
ignored_lines = { types = ["array"] }
extraneous_args = { types = ["boolean"] }
need_stdout = { types = ["boolean"] }
on_change_strategy = { types = ["string"], choices = ["wait_then_restart", "kill_then_restart"] }
on_success = { types = ["string"] }
show_command_error_code = { types = ["boolean"] }
scroll_anchor = { types = ["string"], choices = ["first", "last", "auto"] }
skin = { types = ["table"] }
