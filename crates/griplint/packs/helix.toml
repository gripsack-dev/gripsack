# Data pack for helix — ported from griplint-py (plan/0012).
# Review on upstream releases; the diff *is* the changelog review.

[meta]
tool = "helix"
handles = ["config.toml"]
format = "toml"
# "v25." because host lockfiles pin tag-style versions ("v25.7")
supported = ["25.", "v25."]
series = "v25"
coverage_warning = "key tables are written for helix 25.x; this module pins {version} — results may be stale"

[files."config.toml".rules.""]
theme = { types = ["string"] }

[files."config.toml".rules."editor"]
scrolloff = { types = ["integer"] }
mouse = { types = ["boolean"] }
middle-click-paste = { types = ["boolean"] }
scroll-lines = { types = ["integer"] }
shell = { types = ["array"] }
line-number = { types = ["string"], choices = ["absolute", "relative"] }
cursorline = { types = ["boolean"] }
cursorcolumn = { types = ["boolean"] }
gutters = { types = ["array"] }
auto-completion = { types = ["boolean"] }
auto-format = { types = ["boolean"] }
auto-save = { types = ["boolean"] }
idle-timeout = { types = ["integer"] }
completion-timeout = { types = ["integer"] }
completion-trigger-len = { types = ["integer"] }
completion-replace = { types = ["boolean"] }
auto-info = { types = ["boolean"] }
true-color = { types = ["boolean"] }
rulers = { types = ["array"] }
bufferline = { types = ["string"], choices = ["always", "never", "multiple"] }
color-modes = { types = ["boolean"] }
popup-border = { types = ["string"], choices = ["none", "all", "popup", "menu"] }
border = { types = ["boolean"] }
insert-final-newline = { types = ["boolean"] }
trim-final-newlines = { types = ["boolean"] }
trim-trailing-whitespace = { types = ["boolean"] }
hidden = { types = ["boolean"] }
wrap-indicator = { types = ["string"] }
jump-label-alphabet = { types = ["string"] }

[files."config.toml".rules."editor.cursor-shape"]
normal = { types = ["string"], choices = ["block", "bar", "underline", "hidden"] }
insert = { types = ["string"], choices = ["block", "bar", "underline", "hidden"] }
select = { types = ["string"], choices = ["block", "bar", "underline", "hidden"] }

[files."config.toml".rules."editor.indent-guides"]
render = { types = ["boolean"] }
character = { types = ["string"] }
skip-levels = { types = ["integer"] }

[files."config.toml".rules."editor.soft-wrap"]
enable = { types = ["boolean"] }
max-wrap = { types = ["integer"] }
max-indent-retain = { types = ["integer"] }
wrap-indicator = { types = ["string"] }
wrap-at-text-width = { types = ["boolean"] }

[files."config.toml".rules."editor.statusline"]
left = { types = ["array"] }
center = { types = ["array"] }
right = { types = ["array"] }
separator = { types = ["string"] }
mode = "free"

[files."config.toml".rules."editor.file-picker"]
hidden = { types = ["boolean"] }
follow-symlinks = { types = ["boolean"] }
git-ignore = { types = ["boolean"] }
git-global = { types = ["boolean"] }
git-exclude = { types = ["boolean"] }
ignore = { types = ["boolean"] }

[files."config.toml".rules."editor.whitespace"]
# docs.helix-editor.com/editor.html #[editor.whitespace]: render is
# "all"/"none" or a per-character table (space/nbsp/nnbsp/tab/newline);
# choices are omitted because the table form is legal TOML here.
render = { types = ["string", "table"] }
characters = { types = ["table"] }

[files."config.toml".rules."editor.lsp"]
# docs.helix-editor.com/editor.html #[editor.lsp] (25.x): all boolean
# except inlay-hints-length-limit.
enable = { types = ["boolean"] }
display-messages = { types = ["boolean"] }
display-progress-messages = { types = ["boolean"] }
auto-signature-help = { types = ["boolean"] }
display-inlay-hints = { types = ["boolean"] }
inlay-hints-length-limit = { types = ["integer"] }
display-color-swatches = { types = ["boolean"] }
display-signature-help-docs = { types = ["boolean"] }
snippets = { types = ["boolean"] }
goto-reference-include-declaration = { types = ["boolean"] }

[files."config.toml".rules."editor.inline-diagnostics"]
# docs.helix-editor.com/editor.html #[editor.inline-diagnostics] (25.07);
# key set verified against helix-view/src/annotations/diagnostics.rs
# (tag 25.07): InlineDiagnosticsConfig is deny_unknown_fields — typos are
# hard errors in helix itself. min-diagnostic-width is parsed by the
# source but undocumented in the book. No `enable` key: diagnostics are
# switched on via cursor-line/other-lines != "disable".
cursor-line = { types = ["string"], choices = ["disable", "hint", "info", "warning", "error"] }
other-lines = { types = ["string"], choices = ["disable", "hint", "info", "warning", "error"] }
min-diagnostic-width = { types = ["integer"] }
prefix-len = { types = ["integer"] }
max-wrap = { types = ["integer"] }
max-diagnostics = { types = ["integer"] }

[files."config.toml".rules."keys"]
# user-defined mode tables (normal/insert/select/…) — anything goes
_free = true
