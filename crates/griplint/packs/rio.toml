background_image = { types = ["table"] }
decorations = { types = ["string"] }
macos_use_unified_titlebar = { types = ["boolean"] }
macos_use_shadow = { types = ["boolean"] }
macos_traffic_light_position_x = { types = ["integer", "float"] }
macos_traffic_light_position_y = { types = ["integer", "float"] }
initial_title = { types = ["string"] }
windows_use_undecorated_shadow = { types = ["boolean"] }
windows_use_no_redirection_bitmap = { types = ["boolean"] }
windows_corner_preference = { types = ["string"] }
colorspace = { types = ["string"] }
columns = { types = ["integer"] }
rows = { types = ["integer"] }
