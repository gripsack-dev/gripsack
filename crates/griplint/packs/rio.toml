# Data pack for rio — ported from griplint-py (plan/0012).
# Review on upstream releases; the diff *is* the changelog review.

[meta]
tool = "rio"
handles = ["config.toml"]
format = "toml"
supported = ["0.2"]
series = "v0"
coverage_warning = "key tables are written for a different major version; this module pins {version} — results may be stale"

[files."config.toml".rules.""]
use_fork = { types = ["boolean"] }
working_dir = { types = ["string"] }
line_height = { types = ["integer", "float"] }
theme = { types = ["string"] }
env_vars = { types = ["array"] }
option_as_alt = { types = ["string"] }
force_theme = { types = ["string"] }
ignore_selection_fg_color = { types = ["boolean"] }
confirm_before_quit = { types = ["boolean"] }
grapheme_clustering = { types = ["boolean"] }
copy_on_select = { types = ["boolean"] }
hide_cursor_when_typing = { types = ["boolean"] }
draw_bold_text_with_light_colors = { types = ["boolean"] }
enable_scroll_bar = { types = ["boolean"] }
scrollback_history_limit = { types = ["integer"] }
bindings = { types = ["array"] }

[files."config.toml".rules."cursor"]
shape = { types = ["string"] }
blinking = { types = ["boolean"] }
blinking_interval = { types = ["integer"] }

[files."config.toml".rules."shell"]
program = { types = ["string"] }
args = { types = ["array"] }

[files."config.toml".rules."editor"]
program = { types = ["string"] }
args = { types = ["array"] }

[files."config.toml".rules."scroll"]
