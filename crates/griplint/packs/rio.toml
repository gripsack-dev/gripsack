color = { types = ["array"] }
mode = { types = ["string"] }
color_automation = { types = ["array"] }
clickable = { types = ["boolean"] }
current_working_directory = { types = ["boolean"] }
use_terminal_title = { types = ["boolean"] }
hide_if_single = { types = ["boolean"] }
use_split = { types = ["boolean"] }
open_config_with_split = { types = ["boolean"] }
unfocused_split_opacity = { types = ["integer", "float"] }
unfocused_split_fill = { types = ["array"] }
max_tab_width = { types = ["integer", "float"] }

[files."config.toml".rules."renderer"]
