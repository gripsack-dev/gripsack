[package]
name = "gripsack-buildkit"
description = "Gripsack-owned BuildKit adapter: bounded bridge protocol, worker lease policy and LLB validation (Epic B)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
sha2.workspace = true
gripsack-process.workspace = true
gripsack-policy.workspace = true
gripsack-fs.workspace = true
protobuf = "=3.7.2"
getrandom = "0.4"
libc = "0.2"
tar = "0.4"
flate2 = "1"
tempfile = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
gripsack-fetch.workspace = true
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-virtualization = { version = "0.3", default-features = false, features = ["std", "VZVirtualMachine", "VZVirtualMachineConfiguration"] }

[build-dependencies]
protobuf-codegen = "=3.7.2"

