[package]
name = "gripsack-fetch"
description = "gripsack bounded acquisition, built-in fetchers and transport plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate", "bzip2", "zstd"] }
gripsack-ir.workspace = true
gripsack-fs.workspace = true
gripsack-store.workspace = true
gripsack-policy.workspace = true
sha2.workspace = true
tar = "0.4"
thiserror.workspace = true
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Keep the existing forward-proxy HTTP semantics; TLS is supplied explicitly
# through the connector API, without ureq's obsolete bundled root dependency.
ureq = { version = "2.12.1", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.10"

toml.workspace = true
gripsack-process.workspace = true
tempfile = "3"
url = "2"
httpdate = "1"
bzip2 = "0.6"
zstd = "0.14.3"
crc32fast = "1"
libc = "0.2"
parking_lot = "0.12"
