[package]
name = "gripsack-fetch"
description = "gripsack built-in fetchers and sourcerer plugin host (plan/0002)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
gripsack-ir.workspace = true
gripsack-store.workspace = true
sha2.workspace = true
tar = "0.4"
thiserror.workspace = true
tracing = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# pinned to ureq's TLS stack: bundled webpki roots + system roots
# (SSL_CERT_FILE) so TLS-intercepting proxies verify (see http.rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0"

toml.workspace = true

[dev-dependencies]
tempfile = "3"
