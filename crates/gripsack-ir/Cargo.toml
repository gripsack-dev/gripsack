[package]
name = "gripsack-ir"
description = "gripsack IR types and validation (plan/0001)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(verus_only)", "cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)",
] }

[dependencies]
gripsack-policy.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vstd = "=0.0.0-2026-10-04-0306"

[dev-dependencies]
# Real JSON Schema validation for the schema↔parser acceptance corpus
# (0042 E). No remote refs in the IR schema, so nothing beyond the
# core engine: default features pull reqwest/rustls.
jsonschema = { version = "0.55", default-features = false }
