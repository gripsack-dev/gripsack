# The env repo declaration — gripsack's equivalent of package.json.
# Docs: https://gripsack.dev/docs/settings-reference.html

[env]
name = "my-env"        # your environment's name

# Environment variables injected at eval/build time:
# [eval.env]
# CARGO_NET_GIT_FETCH_WITH_CLI = "true"

# Plugin fetchers for transports the core doesn't cover (0002 §4):
# [fetchers.internal]
# plugin = "gripfetch-acme"

# Linters: a config linter per tool, driven by grip check (0011):
# [linters.helix]
# package = "griplint-helix"

[settings]
# keep_generations = 10
