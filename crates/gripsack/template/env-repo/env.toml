# The env repo declaration — gripsack's equivalent of pyproject.toml.
# Docs: https://gripsack.dev/docs/settings-reference.html

[env]
name = "my-env"        # your environment's name
frontend = "python"    # the typed Python frontend (TypeScript is on the roadmap)

# Extra packages provisioned into the frontend venv at eval time —
# your modules may import them. gripsack provisions its own frontend;
# there is no venv for you to manage.
# [eval]
# deps = ["requests"]

# Environment variables injected at eval/build time:
# [eval.env]
# CARGO_NET_GIT_FETCH_WITH_CLI = "true"

# Plugin fetchers for transports the core doesn't cover (0002 §4):
# [fetchers.internal]
# plugin = "gripfetch-acme"

# Linters: a config linter per tool, driven by grip check (0011):
# [linters.helix]
# package = "griplint-helix"

[settings]
# keep_generations = 10
