[package]
name = "gripsack"
description = "your whole environment in one bag — the grip CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Cargo's VCS-free file discovery otherwise omits the embedded dotfile.
include = ["src/**", "template/**", "template/env-repo/.gitignore"]

[[bin]]
name = "grip"
path = "src/main.rs"

[dependencies]
clap.workspace = true
owo-colors.workspace = true
dialoguer.workspace = true
sha2.workspace = true
indicatif = "0.18"
gripsack-config.workspace = true
gripsack-fs.workspace = true
gripsack-ir.workspace = true
gripsack-store.workspace = true
gripsack-policy.workspace = true
gripsack-trace.workspace = true
tracing = "0.1"
gripsack-exec.workspace = true
gripsack-fetch.workspace = true
flate2 = "1"
tar = "0.4"
# Same HTTP/TLS stack as gripsack-fetch (rustls only, never openssl); kept local
# so the Conda helper's pinned gripsack-fetch sources stay untouched.
ureq = { version = "2.12.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
serde.workspace = true
serde_json.workspace = true
gripsack-process.workspace = true
libc = "0.2"
rustix = { version = "1", features = ["process"] }

tempfile = "3"
