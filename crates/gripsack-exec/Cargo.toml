[package]
name = "gripsack-exec"
description = "gripsack workspace realization and profile lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gripsack-conda.workspace = true
gripsack-config.workspace = true
gripsack-fetch.workspace = true
gripsack-ir.workspace = true
gripsack-host.workspace = true
gripsack-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
sha2.workspace = true
tracing = "0.1"
libc = "0.2"
tempfile = "3"
getrandom = "0.4"
memchr = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
bzip2 = "0.6"
zstd = "0.14.3"
tar = "0.4"
# Local services use Unix HTTP; artifact registries use the existing ring/rustls provider.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
zeroize = "1"
# Credential-free URI parsing for the trust audit and source-bundle file URLs
# (moved from gripsack-store, plan/0056 §24).
url = "2"

[dev-dependencies]
# Schema↔producer parity tests for the trust/evaluation/source-bundle wire
# contracts (moved from gripsack-store with those codecs).
jsonschema = { version = "0.55", default-features = false }
